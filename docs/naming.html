<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>名前を答える</title><link rel="stylesheet" href="web_pilot/style.css"></head>
<body data-phase="naming"><header><span>名前を答える</span><span id="status"></span></header>
